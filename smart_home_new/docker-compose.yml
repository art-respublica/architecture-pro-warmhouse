services:
  shn-db:
    image: postgres:16-alpine
    container_name: shn-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shn-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: shn-zookeeper
    networks:
      - shn-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: shn-kafka
    depends_on:
      - zookeeper
    networks:
      - shn-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "my-topic-name:1:1"

  client-api:
    build:
      context: client-api
      dockerfile: Dockerfile
    container_name: shn-client-api
    depends_on:
      shn-db:
        condition: service_healthy
      device-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - shn-network

  device-service:
    build:
      context: device-service
      dockerfile: Dockerfile
    container_name: shn-device-service
    depends_on:
      shn-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - shn-network

  telemetry-service:
    build:
      context: telemetry-service
      dockerfile: Dockerfile
    container_name: shn-telemetry-service
    depends_on:
      shn-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - shn-network

networks:
  shn-network:
    driver: bridge

volumes:
  postgres_data: